<div class="contenedor-login">                                                  <!-- Mismo estilo que el login -->
  <div class="card shadow-lg tarjeta">
    <div class="card-body p-4">
      <h2 class="text-center titulo"><i class="bi bi-person-plus"></i> Crear cuenta</h2>
      <p class="text-center text-muted mb-4">Registro de pacientes</p>

      <form (ngSubmit)="registrar()">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input id="nombre" name="nombre" type="text" class="form-control" [(ngModel)]="nombre" />
        </div>
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input id="usuario" name="usuario" type="text" class="form-control" [(ngModel)]="usuario" />
        </div>
        <div class="mb-3">
          <label for="clave" class="form-label">Clave</label>
          <input id="clave" name="clave" type="password" class="form-control" [(ngModel)]="clave" />
        </div>
        <div class="mb-4">
          <label for="confirmar" class="form-label">Repetir clave</label>
          <input id="confirmar" name="confirmar" type="password" class="form-control" [(ngModel)]="confirmar" />
        </div>
        <button type="submit" class="btn btn-success w-100">Crear cuenta</button>
      </form>

      <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
