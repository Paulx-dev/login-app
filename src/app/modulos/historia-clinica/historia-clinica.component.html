<div class="container py-4">                                                    <!-- Contenedor centrado -->
  <h3 class="mb-3"><i class="bi bi-file-medical"></i> Historia Clínica</h3>      <!-- Título del módulo -->

  <div class="row g-3">                                                         <!-- Fila con dos columnas -->
    <div class="col-md-5">                                                      <!-- Columna izquierda: datos del paciente -->
      <div class="card shadow-sm">                                              <!-- Tarjeta -->
        <div class="card-header bg-success text-white">Datos del paciente</div> <!-- Encabezado de la tarjeta -->
        <div class="card-body">                                                 <!-- Cuerpo -->
          <input class="form-control mb-2" placeholder="Buscar por cédula o nombre" /> <!-- Buscador de ejemplo -->
          <p class="mb-1"><strong>Paciente:</strong> María Pérez</p>            <!-- Dato de ejemplo -->
          <p class="mb-1"><strong>Edad:</strong> 34 años</p>                    <!-- Dato de ejemplo -->
          <p class="mb-0"><strong>Alergias:</strong> Ninguna</p>                <!-- Dato de ejemplo -->
        </div>
      </div>
    </div>

    <div class="col-md-7">                                                      <!-- Columna derecha: odontograma y evolución -->
      <div class="card shadow-sm mb-3">                                         <!-- Tarjeta del odontograma -->
        <div class="card-header bg-success text-white">Odontograma</div>        <!-- Encabezado -->
        <div class="card-body text-center text-muted py-5">[ Aquí irá el odontograma ]</div> <!-- Espacio reservado -->
      </div>
      <div class="card shadow-sm">                                              <!-- Tarjeta de evolución -->
        <div class="card-header bg-success text-white">Evolución clínica</div>  <!-- Encabezado -->
        <div class="card-body"><textarea class="form-control" rows="3" placeholder="Notas de la consulta..."></textarea></div> <!-- Área de texto -->
      </div>
    </div>
  </div>
</div>
