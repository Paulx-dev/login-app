<div class="d-flex justify-content-between align-items-center mt-3 mb-2">
  <p class="text-muted mb-0">Los horarios bloqueados no se pueden agendar ni aparecen como disponibles.</p>
  <button mat-flat-button (click)="nuevo()">+ Bloquear horario</button>
</div>

<table mat-table [dataSource]="dataSource" class="shadow-sm">
  <ng-container matColumnDef="odontologo">
    <th mat-header-cell *matHeaderCellDef>Odontólogo</th>
    <td mat-cell *matCellDef="let b">{{ b.odontologo }}</td>
  </ng-container>
  <ng-container matColumnDef="desde">
    <th mat-header-cell *matHeaderCellDef>Desde</th>
    <td mat-cell *matCellDef="let b">{{ b.inicio | date: 'dd/MM/yyyy HH:mm' }}</td>
  </ng-container>
  <ng-container matColumnDef="hasta">
    <th mat-header-cell *matHeaderCellDef>Hasta</th>
    <td mat-cell *matCellDef="let b">{{ b.fin | date: 'dd/MM/yyyy HH:mm' }}</td>
  </ng-container>
  <ng-container matColumnDef="motivo">
    <th mat-header-cell *matHeaderCellDef>Motivo</th>
    <td mat-cell *matCellDef="let b">{{ b.motivo }}</td>
  </ng-container>
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let b"><button mat-button (click)="eliminar(b)">Eliminar</button></td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
  <tr class="mat-row" *matNoDataRow>
    <td class="p-3" [attr.colspan]="columnas.length">No hay horarios bloqueados.</td>
  </tr>
</table>
